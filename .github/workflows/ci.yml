name: CI

on:
  push:
    branches: [main, phase0-nanobind-core]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        # [test] pulls the parity oracles (gsply, pycolmap, Open3D) so the codec
        # parity suites actually run in CI instead of skipping; builds _core.
        run: |
          uv venv --seed
          uv pip install -e ".[dev,test]"
      - name: Install CPU Torch interop oracle
        # Torch remains test-only and outside SceneIO's extras/runtime surface.
        # One required Linux lane exercises writable DLPack/from_numpy behavior.
        run: uv pip install torch --index https://download.pytorch.org/whl/cpu
      - name: Ruff
        run: .venv/bin/ruff check src tests
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Benchmark harness smoke (all 50 codecs)
        run: .venv/bin/python bench/bench_io.py --runs 1 --scale 0.001 --json "${{ runner.temp }}/sceneio-benchmark.json"
      - name: I/O throughput and memory regression guard
        run: .venv/bin/python bench/bench_io.py --runs 5 --require-o4-gains --require-o5-inspect-gains --require-o5-partial-gains --json "${{ runner.temp }}/sceneio-benchmark-guard.json"
      - name: Upload benchmark smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sceneio-benchmark-results
          path: ${{ runner.temp }}/sceneio-benchmark*.json

  mmap-platform:
    name: mmap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --seed
          uv pip install -e ".[dev,test]"
      - name: Cross-platform mmap, partial-read, zero-copy, file-sink, and locked-file tests
        run: .venv/Scripts/python.exe -m pytest -q tests/test_io_mmap.py tests/test_io_partial.py tests/test_io_zero_copy.py tests/test_io_parallel.py tests/records/test_state_trajectory.py tests/codecs/test_safetensors.py tests/codecs/test_pts.py tests/codecs/test_dmb.py tests/codecs/test_bal.py tests/codecs/test_bmp_tga.py tests/codecs/test_pcd.py tests/codecs/test_euroc_state.py tests/codecs/test_stl.py tests/codecs/test_off.py
        if: runner.os == 'Windows'
      - name: Cross-platform mmap, partial-read, zero-copy, and file-sink tests
        run: .venv/bin/python -m pytest -q tests/test_io_mmap.py tests/test_io_partial.py tests/test_io_zero_copy.py tests/test_io_parallel.py tests/records/test_state_trajectory.py tests/codecs/test_safetensors.py tests/codecs/test_pts.py tests/codecs/test_dmb.py tests/codecs/test_bal.py tests/codecs/test_bmp_tga.py tests/codecs/test_pcd.py tests/codecs/test_euroc_state.py tests/codecs/test_stl.py tests/codecs/test_off.py
        if: runner.os != 'Windows'
