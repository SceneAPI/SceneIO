name: CI

on:
  push:
    branches: [main, phase0-nanobind-core]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        # [test] pulls the parity oracles (gsply, pycolmap) so the codec parity
        # suites actually run in CI instead of skipping; builds the _core ext.
        run: |
          uv venv --seed
          uv pip install -e ".[dev,test]"
      - name: Ruff
        run: .venv/bin/ruff check src tests
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Benchmark harness smoke (all 23 codecs)
        run: .venv/bin/python bench/bench_io.py --runs 1 --scale 0.001 --json "${{ runner.temp }}/sceneio-benchmark.json"
      - name: Upload benchmark smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sceneio-benchmark-smoke
          path: ${{ runner.temp }}/sceneio-benchmark.json

  mmap-platform:
    name: mmap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --seed
          uv pip install -e ".[dev]"
      - name: Cross-platform mmap and locked-file tests
        run: .venv/Scripts/python.exe -m pytest -q tests/test_io_mmap.py
        if: runner.os == 'Windows'
      - name: Cross-platform mmap tests
        run: .venv/bin/python -m pytest -q tests/test_io_mmap.py
        if: runner.os != 'Windows'
