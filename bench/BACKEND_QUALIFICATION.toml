schema_version = 1
decision_id = "jpeg-rgb8-v1"
codec_id = "jpeg"
retained_backend = "stb"
candidate_backend = "libjpeg-turbo"
retained_marker = "stb"
candidate_marker = "libjpeg-turbo-3.2.0"

[methodology]
local_sessions = 6
remote_sessions = 8
memory_samples = 3
startup_processes = 6
order_seed = 20260728
clock = "time.perf_counter_ns"
sample_policy = "retain every finite sample; no post-measurement deletion"
summary = "paired-session median ratio and 1.4826-scaled MAD of log ratios"
cache_mode = "warm; cold-cache performance is not claimed"
lane_policy = "one intra-file lane; neither backend exposes an intra-file lane control"

[thresholds]
rgb_decode_max_abs = 4
grayscale_decode_max_abs = 2
retained_fallback_max_abs = 0
rgb_decode_psnr_min_db = 48.0
grayscale_decode_psnr_min_db = 50.0
encode_psnr_per_fixture_delta_min_db = -0.15
encode_psnr_profile_median_delta_min_db = -0.05
encoded_size_per_fixture_ratio_max = 1.05
encoded_size_profile_geomean_ratio_max = 1.02
representative_cell_robust_ratio_min = 0.95
small_cell_robust_ratio_min = 0.90
encode_geomean_ratio_min = 1.20
encode_geomean_robust_ratio_min = 1.10
decode_geomean_ratio_min = 1.15
decode_geomean_robust_ratio_min = 1.05
public_surface_ratio_min = 1.10
public_surface_robust_ratio_min = 1.00
normalized_mad_small_max = 0.08
normalized_mad_other_max = 0.05
traced_sink_min_allowance_bytes = 1048576
traced_sink_output_fraction_max = 0.125
traced_mmap_min_allowance_bytes = 1048576
traced_mmap_file_fraction_max = 0.125
traced_candidate_extra_bytes_max = 1048576
memory_representative_ratio_max = 1.20
memory_representative_allowance_bytes = 16777216
memory_large_ratio_max = 1.15
memory_large_allowance_bytes = 33554432
memory_plateau_allowance_bytes = 8388608
import_ratio_max = 1.15
import_allowance_ns = 10000000
first_call_ratio_max = 1.10
first_call_allowance_ns = 2000000
wheel_ratio_max = 1.15
wheel_extra_bytes_max = 1048576
native_ratio_max = 1.25
native_extra_bytes_max = 2097152
determinism_repeats = 20
determinism_processes = 3

