schema_version = 1
baseline_document = "bench/BASELINE.md"
validated_implementation = "a5e7fa4498728eb1bd166f9af9e37b3eda779e17"
provisional_definition = "implemented and correctness-tested, but backend qualification is incomplete; evidence_gaps states what remains"

[status_definitions]
qualified = "candidate comparison, fidelity checks, fixtures, and required toolchain evidence are complete"
provisional = "correct implementation exists, but one or more qualification inputs remain"
known_gap = "current backend has a measured performance gap and a viable candidate is named"
native_by_necessity = "no acceptable reusable backend exists after a recorded candidate survey"
not_applicable = "the direction or profile is intentionally unsupported"

