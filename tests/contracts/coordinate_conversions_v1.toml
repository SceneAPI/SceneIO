schema_version = 1
api = "sceneio.convert_coordinates"
default_target = "colmap"
world_transform_direction = "source_world_meters_to_target_world_meters"
world_transform_translation_unit = "meters"
identity_policy = "only_qualified_records_may_return_identity"
source_override = "may_refine_unknown_or_arbitrary_fields_but_must_not_conflict_with_declared_fields"

# Per-format file <-> record directionality.  `decode` is file-to-record,
# `encode` is record-to-file, and `conversion` states whether the public
# record can use sceneio.convert_coordinates directly, needs the format
# adapter/context, or has no independent spatial conversion.  `tests` points
# at the executable independent-oracle evidence; the authoritative format
# reference remains FormatCoordinateContract.reference.
