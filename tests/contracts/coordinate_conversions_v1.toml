[qualified.PosedViewSet]
camera_axes = ["opencv", "opengl"]
pose_directions = ["world_to_camera", "camera_to_world"]
quaternion_orders = ["wxyz", "xyzw"]
world_transform = "proper_rigid"
converted = ["camera_axes", "pose_direction", "quaternion_order", "translations", "unit_scale"]
preserved = ["names", "timestamps", "camera_indices", "cameras"]

[qualified.PointCloud]
coordinate_frames = ["unknown", "opencv", "opengl", "enu", "ned"]
implicit_frame_pairs = ["opencv:opengl", "opengl:opencv", "enu:ned", "ned:enu"]
world_transform = "invertible_affine"
converted = ["positions", "origin", "normals", "widths", "velocities", "accelerations", "unit_scale"]
preserved = ["colors", "colors16", "intensities", "display_colors", "display_opacities", "ids", "organization", "display_color_space"]
refuses = ["nondefault_viewpoint", "las_waveform", "nonsimilarity_with_scalar_widths"]

[qualified.Mesh]
coordinate_frames = ["unknown", "opencv", "opengl", "enu", "ned"]
implicit_frame_pairs = ["opencv:opengl", "opengl:opencv", "enu:ned", "ned:enu"]
world_transform = "orientation_preserving_invertible_affine"
converted = ["positions", "vertex_normals", "corner_normals", "local_transform", "unit_scale"]
preserved = ["topology", "uvs", "colors", "display_fields", "primitive_metadata", "materials", "orientation", "double_sided_presence"]
refuses = ["reflection_without_winding_policy"]

[unqualified]
record_types = ["Image", "GaussianCloud", "Reconstruction"]
identity_still_refuses = true
