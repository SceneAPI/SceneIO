schema_version = 1
contract_date = "2026-08-29"
record = "sceneio.GaussianCloud"

[vocabulary]
quaternion_norm = ["unknown", "unconstrained", "unit"]
sh_basis = ["unknown", "3dgs_real"]
sh_phase = ["unknown", "3dgs"]
sh_coefficient_order = ["unknown", "degree_then_m_neg_to_pos"]
color_space = ["unknown", "srgb", "linear_srgb"]
coordinate_frame = ["unknown", "opencv", "opengl", "enu", "ned"]
scale_to_meters_source = ["unknown", "format", "file", "caller"]

# `3dgs_real` is the real, orthonormal polynomial basis used by the original
# 3DGS implementation. `3dgs` pins its signs/phase to the explicit degree 0-3
# equations in sh_utils.py instead of relying on an overloaded phase name.
[spherical_harmonics]
basis = "3dgs_real"
normalization = "orthonormal"
phase = "3dgs"
coefficient_order = "degree_then_m_neg_to_pos"
dc_equation = "rgb = 0.5 + 0.28209479177387814 * sh_dc"
degree_one_equation = "rgb = dc - C1*y*c_1n1 + C1*z*c_10 - C1*x*c_1p1"
reference = "https://github.com/graphdeco-inria/gaussian-splatting/blob/54c035f7834b564019656c3e3fcc3646292f727d/utils/sh_utils.py"

[[carriers]]
id = "gaussian_ply"
quaternion_order = "wxyz"
quaternion_norm = "unconstrained"
quaternion_consumer = "normalizes_before_covariance"
sh_basis = "3dgs_real"
sh_phase = "3dgs"
sh_coefficient_order = "degree_then_m_neg_to_pos"
sh_layout = "channel_grouped"
degrees = [0, 1, 2, 3]
color_space = "unknown"
coordinate_frame = "unknown"
scale_to_meters_source = "unknown"
quantization = "exact_float32"
inverse = "exact"
evidence = [
  "https://github.com/graphdeco-inria/gaussian-splatting/blob/54c035f7834b564019656c3e3fcc3646292f727d/scene/gaussian_model.py",
  "https://github.com/graphdeco-inria/gaussian-splatting/blob/54c035f7834b564019656c3e3fcc3646292f727d/utils/general_utils.py",
  "tests/codecs/test_ply.py",
]

