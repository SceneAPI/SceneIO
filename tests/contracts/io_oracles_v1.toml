read_only_formats = ["mp4", "rtmv"]

# A codec is qualified only when its normal test run executes evidence in both
# file-to-record and record-to-file directions. Read-only formats must instead
# name and test that limitation. Round-trip-only evidence is insufficient:
# every ledger row must also name an implementation or an independently
# implemented specification-level parser as its oracle.
required_row_fields = ["id", "decode", "encode", "conversion", "oracle", "tests"]
evidence_directory = "tests/codecs"
read_test_name_markers = ["read", "decode", "roundtrip", "parity", "oracle"]
write_test_name_markers = ["write", "writer", "encode", "roundtrip", "parity", "oracle"]
source_evidence_markers = ["oracle", "parity"]
disallowed_oracle_descriptions = ["sceneio", "roundtrip only", "self"]

# These capabilities can intentionally change values. Their oracle tests must
# compare decoded semantics or a documented error/quantization bound rather
# than claim byte equality with the source record.
lossy_or_quantized_formats = [
  "compressed_ply",
  "sog",
  "ksplat",
  "spz",
  "jpeg",
  "hdr",
  "webp",
  "avif",
  "webm",
