schema_version = 1
catalog_date = "2026-08-03"
catalog_purpose = "Pinned external implementations and specifications used to qualify SceneIO conversion and normalization claims."

# This is a test/reference catalog.  It is intentionally separate from the
# runtime registry: importing SceneIO must continue to require NumPy only.
allowed_roles = ["runtime_required", "runtime_optional", "test_executable", "generated_vector", "reference_only"]
allowed_authorities = ["format_owner", "standards_body", "independent_implementation", "provider_binding", "semantic_reference"]
allowed_qualifications = ["executed", "captured", "reference", "candidate"]
allowed_license_classes = ["permissive", "weak_copyleft", "mixed_scoped", "strong_copyleft_reference"]
permitted_license_expressions = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MIT-CMU",
  "MPL-2.0",
  "TOST-1.0",
  "Zlib",
  "LGPL-3.0-or-later",
]
reference_only_license_expressions = ["GPL-3.0", "GPL-3.0-or-later", "AGPL-3.0-or-later"]
required_source_ids = [
  "colmap", "pycolmap", "camtools", "rootba", "openmvg", "alicevision",
  "evo", "pykitti", "kalibr", "g2o", "hloc", "open3d", "pcl", "pdal",
  "trimesh", "gltf_validator", "niantic_spz", "splat_transform", "gsply",
  "gaussian_splats_3d", "openusd", "khronos_gltf", "3dgrut", "kubric", "ncore",
  "scipy", "pyyaml", "numpy", "h5py", "zarr", "arrow", "openexr", "pillow", "tifffile",
  "pye57", "libe57format",
]

